# Supply Chain Digital Twin API Configuration
spring.application.name=supply-chain-api
server.port=8080

# Actuator endpoints for monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Application info
info.app.name=Supply Chain Digital Twin API
info.app.version=0.1.0
info.app.review=1
info.app.description=Cloud-Based Supply Chain Digital Twin

# Logging
logging.level.com.supplychain=INFO
logging.file.name=/opt/supply-chain/logs/api.log
